<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marketing Site &amp; Storefront — Design Brief</title>

    <style>
      /* ─── Tokens ─────────────────────────────────────────────────────────── */
      :root {
        --paper: #f7f8f7;
        --surface: #ffffff;
        --surface-2: #eff2f0;
        --ink: #14181a;
        --ink-2: #384344;
        --muted: #5c6a6b;
        --hairline: #dde3e1;
        --hairline-2: #c8d2cf;
        --accent: #0e6b4f;
        --accent-ink: #ffffff;
        --accent-wash: #e4efe9;
        --amber: #8a5a12;
        --amber-wash: #f6eedd;
        --rust: #9c3a2c;
        --rust-wash: #f7e8e4;
        --shadow:
          0 1px 2px rgba(20, 24, 26, 0.05),
          0 8px 24px -16px rgba(20, 24, 26, 0.18);

        --sans:
          ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        --serif:
          Georgia, 'Iowan Old Style', 'Source Serif Pro', ui-serif, serif;
        --mono:
          ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas,
          'Liberation Mono', monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --paper: #0f1413;
          --surface: #161c1b;
          --surface-2: #1d2524;
          --ink: #e8edea;
          --ink-2: #c3cdc9;
          --muted: #8b9995;
          --hairline: #2a3432;
          --hairline-2: #3a4643;
          --accent: #3fbf8f;
          --accent-ink: #08130e;
          --accent-wash: #132a22;
          --amber: #d7a253;
          --amber-wash: #2a2318;
          --rust: #e08472;
          --rust-wash: #2c1b18;
          --shadow:
            0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -16px rgba(0, 0, 0, 0.7);
        }
      }

      :root[data-theme='dark'] {
        --paper: #0f1413;
        --surface: #161c1b;
        --surface-2: #1d2524;
        --ink: #e8edea;
        --ink-2: #c3cdc9;
        --muted: #8b9995;
        --hairline: #2a3432;
        --hairline-2: #3a4643;
        --accent: #3fbf8f;
        --accent-ink: #08130e;
        --accent-wash: #132a22;
        --amber: #d7a253;
        --amber-wash: #2a2318;
        --rust: #e08472;
        --rust-wash: #2c1b18;
        --shadow:
          0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -16px rgba(0, 0, 0, 0.7);
      }

      /* ─── Base ───────────────────────────────────────────────────────────── */
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--serif);
        font-size: 17px;
        line-height: 1.62;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 24px 120px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 0 56px;
      }

      @media (min-width: 1000px) {
        .wrap {
          grid-template-columns: 200px minmax(0, 1fr);
        }
      }

      /* ─── Masthead ───────────────────────────────────────────────────────── */
      .masthead {
        grid-column: 1 / -1;
        border-bottom: 1px solid var(--hairline);
        padding: 72px 0 40px;
        margin-bottom: 56px;
      }
      .eyebrow {
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 20px;
      }
      .masthead h1 {
        font-family: var(--sans);
        font-size: clamp(34px, 5.5vw, 54px);
        font-weight: 680;
        letter-spacing: -0.028em;
        line-height: 1.06;
        text-wrap: balance;
        max-width: 15ch;
      }
      .standfirst {
        margin-top: 22px;
        max-width: 60ch;
        font-size: 19px;
        color: var(--ink-2);
      }
      .meta-row {
        margin-top: 32px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 28px;
        font-family: var(--sans);
        font-size: 12.5px;
        color: var(--muted);
      }
      .meta-row b {
        color: var(--ink-2);
        font-weight: 600;
      }

      /* ─── Contents rail ──────────────────────────────────────────────────── */
      .rail {
        display: none;
      }
      @media (min-width: 1000px) {
        .rail {
          display: block;
          position: sticky;
          top: 32px;
          align-self: start;
          max-height: calc(100vh - 64px);
          overflow-y: auto;
        }
      }
      .rail-title {
        font-family: var(--sans);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        padding-bottom: 12px;
        border-bottom: 1px solid var(--hairline);
      }
      .rail-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-top: 12px;
      }
      .rail-list a {
        display: block;
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1.35;
        color: var(--muted);
        text-decoration: none;
        padding: 6px 8px;
        border-radius: 4px;
        transition:
          color 0.12s,
          background-color 0.12s;
      }
      .rail-list a:hover {
        color: var(--ink);
        background: var(--surface-2);
      }
      .rail-list a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      /* ─── Prose column ───────────────────────────────────────────────────── */
      .doc {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .doc > section {
        padding-bottom: 12px;
      }
      .doc > section + section {
        margin-top: 64px;
      }

      .doc h2 {
        font-family: var(--sans);
        font-size: 15px;
        font-weight: 640;
        letter-spacing: 0.02em;
        color: var(--ink);
        padding-bottom: 14px;
        border-bottom: 2px solid var(--ink);
        margin-bottom: 28px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
      }
      .doc h2 span {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .doc h3 {
        font-family: var(--sans);
        font-size: 20px;
        font-weight: 640;
        letter-spacing: -0.014em;
        line-height: 1.25;
        text-wrap: balance;
        margin: 40px 0 12px;
      }
      .doc h4 {
        font-family: var(--sans);
        font-size: 14.5px;
        font-weight: 640;
        letter-spacing: -0.005em;
        margin: 28px 0 8px;
      }
      .doc h3:first-of-type {
        margin-top: 0;
      }

      .doc p {
        max-width: 66ch;
        margin-bottom: 16px;
      }
      .doc p:last-child {
        margin-bottom: 0;
      }

      .lede {
        font-size: 18.5px;
        color: var(--ink-2);
      }

      .doc ul,
      .doc ol {
        max-width: 66ch;
        margin: 0 0 16px;
        padding-left: 22px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .doc li {
        padding-left: 2px;
      }
      .doc li::marker {
        color: var(--hairline-2);
      }
      .doc ol li::marker {
        color: var(--muted);
        font-family: var(--sans);
        font-size: 13px;
      }

      strong {
        font-weight: 700;
        color: var(--ink);
      }
      em {
        font-style: italic;
      }

      code,
      .mono {
        font-family: var(--mono);
        font-size: 0.855em;
        background: var(--surface-2);
        border: 1px solid var(--hairline);
        border-radius: 3px;
        padding: 0.1em 0.34em;
        color: var(--ink-2);
        white-space: nowrap;
      }

      a.inline {
        color: var(--accent);
        text-underline-offset: 2px;
      }

      /* ─── Chips ──────────────────────────────────────────────────────────── */
      .chip {
        display: inline-flex;
        align-items: center;
        font-family: var(--sans);
        font-size: 10.5px;
        font-weight: 640;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 3px;
        white-space: nowrap;
        border: 1px solid transparent;
      }
      .chip-built {
        background: var(--accent-wash);
        color: var(--accent);
        border-color: color-mix(in srgb, var(--accent) 22%, transparent);
      }
      .chip-partial {
        background: var(--amber-wash);
        color: var(--amber);
        border-color: color-mix(in srgb, var(--amber) 26%, transparent);
      }
      .chip-missing {
        background: var(--rust-wash);
        color: var(--rust);
        border-color: color-mix(in srgb, var(--rust) 26%, transparent);
      }
      .chip-neutral {
        background: var(--surface-2);
        color: var(--muted);
        border-color: var(--hairline);
      }

      /* ─── Callouts ───────────────────────────────────────────────────────── */
      .note {
        max-width: 66ch;
        border-left: 3px solid var(--hairline-2);
        background: var(--surface);
        padding: 18px 22px;
        margin: 24px 0;
        box-shadow: var(--shadow);
        border-radius: 0 4px 4px 0;
      }
      .note p {
        margin-bottom: 10px;
      }
      .note p:last-child {
        margin-bottom: 0;
      }
      .note-label {
        font-family: var(--sans);
        font-size: 10.5px;
        font-weight: 640;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .note-rule {
        border-left-color: var(--accent);
      }
      .note-rule .note-label {
        color: var(--accent);
      }
      .note-never {
        border-left-color: var(--rust);
      }
      .note-never .note-label {
        color: var(--rust);
      }
      .note-open {
        border-left-color: var(--amber);
      }
      .note-open .note-label {
        color: var(--amber);
      }

      /* ─── Tables ─────────────────────────────────────────────────────────── */
      .table-scroll {
        overflow-x: auto;
        margin: 24px 0;
        border: 1px solid var(--hairline);
        border-radius: 5px;
        background: var(--surface);
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-family: var(--sans);
        font-size: 13.5px;
      }
      thead th {
        text-align: left;
        font-size: 10.5px;
        font-weight: 640;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 12px 16px;
        border-bottom: 1px solid var(--hairline);
        background: var(--surface-2);
        white-space: nowrap;
      }
      tbody td {
        padding: 13px 16px;
        border-bottom: 1px solid var(--hairline);
        vertical-align: top;
        color: var(--ink-2);
        line-height: 1.45;
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      td.num {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      td .mono,
      th .mono {
        background: none;
        border: none;
        padding: 0;
        font-size: 12.5px;
        color: var(--ink);
      }

      /* ─── Brand swatch demo ──────────────────────────────────────────────── */
      .demo {
        margin: 28px 0;
        border: 1px solid var(--hairline);
        border-radius: 6px;
        background: var(--surface);
        overflow: hidden;
      }
      .demo-head {
        padding: 14px 18px;
        border-bottom: 1px solid var(--hairline);
        font-family: var(--sans);
        font-size: 12px;
        color: var(--muted);
        background: var(--surface-2);
      }
      .demo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
        gap: 1px;
        background: var(--hairline);
      }
      .swatch {
        background: var(--surface);
        padding: 16px 14px 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .swatch-hex {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .swatch-dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--brand);
        border: 1px solid var(--hairline-2);
        flex: none;
      }
      .swatch-btn {
        font-family: var(--sans);
        font-size: 12px;
        font-weight: 600;
        background: var(--brand);
        color: #fff;
        border-radius: 4px;
        padding: 8px 10px;
        text-align: center;
      }
      .swatch-badge {
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 600;
        color: #fff;
        background: var(--brand);
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .swatch-verdict {
        font-family: var(--sans);
        font-size: 11px;
        line-height: 1.35;
        color: var(--muted);
      }
      .swatch-verdict.bad {
        color: var(--rust);
      }

      /* ─── State flow ─────────────────────────────────────────────────────── */
      .states {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 24px 0;
      }
      .state {
        flex: 1 1 190px;
        border: 1px solid var(--hairline);
        border-top: 3px solid var(--hairline-2);
        border-radius: 0 0 5px 5px;
        background: var(--surface);
        padding: 14px 16px 16px;
      }
      .state-a {
        border-top-color: var(--muted);
      }
      .state-b {
        border-top-color: var(--accent);
      }
      .state-c {
        border-top-color: var(--amber);
      }
      .state-d {
        border-top-color: var(--rust);
        background: var(--rust-wash);
      }
      .state-name {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 7px;
      }
      .state-copy {
        font-family: var(--sans);
        font-size: 12.5px;
        line-height: 1.45;
        color: var(--muted);
      }

      /* ─── Page-spec cards ────────────────────────────────────────────────── */
      .spec {
        border: 1px solid var(--hairline);
        border-radius: 6px;
        background: var(--surface);
        margin: 20px 0;
        overflow: hidden;
      }
      .spec-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        padding: 13px 18px;
        border-bottom: 1px solid var(--hairline);
        background: var(--surface-2);
      }
      .spec-route {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
      }
      .spec-body {
        padding: 18px 18px 20px;
      }
      .spec-body p,
      .spec-body ul {
        max-width: none;
      }
      .spec-body > :last-child {
        margin-bottom: 0;
      }
      .spec-file {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--muted);
        padding: 0 18px 14px;
      }

      .footer-note {
        grid-column: 1 / -1;
        margin-top: 80px;
        padding-top: 24px;
        border-top: 1px solid var(--hairline);
        font-family: var(--sans);
        font-size: 12.5px;
        color: var(--muted);
        max-width: 70ch;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
    <style>
      body {
        background: #fff;
        padding: 20px;
      }
      .demo {
        margin: 0;
      }
      .demo-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="doc">
        <div class="demo">
          <div class="demo-head">
            Identical markup · five tenant values · white foreground assumed
          </div>
          <div class="demo-grid">
            <div class="swatch" style="--brand: #0e6b4f">
              <div class="swatch-hex">
                <span class="swatch-dot"></span>#0E6B4F
              </div>
              <div class="swatch-badge">3</div>
              <div class="swatch-btn">Add to cart</div>
              <div class="swatch-verdict">Fine</div>
            </div>
            <div class="swatch" style="--brand: #7a2e8c">
              <div class="swatch-hex">
                <span class="swatch-dot"></span>#7A2E8C
              </div>
              <div class="swatch-badge">3</div>
              <div class="swatch-btn">Add to cart</div>
              <div class="swatch-verdict">Fine</div>
            </div>
            <div class="swatch" style="--brand: #d81b60">
              <div class="swatch-hex">
                <span class="swatch-dot"></span>#D81B60
              </div>
              <div class="swatch-badge">3</div>
              <div class="swatch-btn">Add to cart</div>
              <div class="swatch-verdict">Borderline</div>
            </div>
            <div class="swatch" style="--brand: #7ce38b">
              <div class="swatch-hex">
                <span class="swatch-dot"></span>#7CE38B
              </div>
              <div class="swatch-badge">3</div>
              <div class="swatch-btn">Add to cart</div>
              <div class="swatch-verdict bad">Unreadable</div>
            </div>
            <div class="swatch" style="--brand: #f2d024">
              <div class="swatch-hex">
                <span class="swatch-dot"></span>#F2D024
              </div>
              <div class="swatch-badge">3</div>
              <div class="swatch-btn">Add to cart</div>
              <div class="swatch-verdict bad">Unreadable</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
